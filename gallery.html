<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Product Gallery</title>
    <style>
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #334155;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        
        .product2 {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
            text-align: center;
            box-sizing: border-box;
        }

       
        .product2 h2 {
            font-size: 22px;
            color: #0f172a;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

       
        .image-container {
            width: 100%;
            height: 300px;
            background-color: #f8fafc;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #f1f5f9;
        }

        .large-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Symmetrical thumbnail gallery track */
        .image-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }

        
        .image-gallery img {
            width: 68px;
            height: 68px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            background-color: #f1f5f9;
            transition: all 0.2s ease-in-out;
        }

        .image-gallery img:hover {
            transform: translateY(-2px);
            border-color: #cbd5e1;
        }

        
        .image-gallery img.active {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }

        
        .arrow {
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
            padding: 8px;
            user-select: none;
            transition: color 0.2s, transform 0.2s;
        }

        .arrow:hover {
            color: #0f172a;
            transform: scale(1.15);
        }

        
        .decription {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            margin-bottom: 24px; /* Creates clean breathing room above the button */
        }

        .decription p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin: 0;
        }

        /*RETURN TO SHOP*/
        .back-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: auto; /* inline width to match button content size */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .back-btn:hover {
            background-color: #f8fafc;
            color: #0f172a;
            border-color: #94a3b8;
            transform: translateY(-1px);
        }

        .back-btn:active {
            transform: translateY(0);
        }

       
    </style>
</head>
<body>

    <section class="product2" id="product-gallery">
        <h2>Product Gallery</h2>

        <div class="image-container">
            <img id="largeImage" class="large-image" src="images/DellOptiPlex.png" alt="Product Image" />
        </div>

        <div class="image-gallery">
            <span class="arrow" onclick="prevImage()">&#9665;</span>
            <img
                class="small-image active"
                src="images/DellOptiPlex.png"
                onclick="changeImage('images/DellOptiPlex.png', 0)"
                alt="Thumbnail 1" />
            <img
                class="small-image"
                src="images/mechanicalkeyboard.png"
                onclick="changeImage('images/mechanicalkeyboard.png', 1)"
                alt="Thumbnail 2" />
            <img
                class="small-image"
                src="images/gamingmouse.png"
                onclick="changeImage('images/images/gamingmouse.png', 2)"
                alt="Thumbnail 3" />
            <span class="arrow" onclick="nextImage()">&#9655;</span>
        </div>

        <div class="decription">
            <p>Clik the left and right arrow button to view the product.</p>
        </div>

       <!--RETURN TO SHOP BUTTON-->
        <button class="btn back-btn" id="backBtn" onclick="goToShop()">Return to Shop</button>
    </section>
    
    <script>
        let images = ["images/DellOptiPlex.png", "images/mechanicalkeyboard.png", "images/gamingmouse.png"];
        let index = 0;

        function updateGalleryView(imageSrc) {
            document.getElementById("largeImage").src = imageSrc;
            
            const thumbnails = document.querySelectorAll(".image-gallery .small-image");
            thumbnails.forEach((thumb, thumbIndex) => {
                if (thumbIndex === index) {
                    thumb.classList.add("active");
                } else {
                    thumb.classList.remove("active");
                }
            });
        }

        function changeImage(imageSrc, clickedIndex) {
            index = clickedIndex;
            updateGalleryView(imageSrc);
        }

        function prevImage() {
            index = (index - 1 + images.length) % images.length;
            updateGalleryView(images[index]);
        }

        function nextImage() {
            index = (index + 1) % images.length;
            updateGalleryView(images[index]);
        }

        //RETURN TO SHOP FUNCTION
        function goToShop() {
            window.location.href = 'index.html'; 
        }
    </script>
	
</body>
</html>
