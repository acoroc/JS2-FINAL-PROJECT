<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Installment Payment Calculator</title>
    <style>
        /* Core Reset & Elegant Dark Corporate Backdrop */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Deep premium slate tone matching storefront */
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Premium Floating Card Container */
        .calculator-card {
            background-color: #ffffff;
            max-width: 440px;
            width: 100%;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.25);
        }
        
        h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 20px;
            background-color: #f8fafc;
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none; /* Modern visual normalization */
        }

        /* Re-add dropdown arrow for select elements */
        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        
        /* Action Button Layout */
        .btn-group {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        button, .back-btn {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        
        #calculateBtn {
            background-color: #0284c7; /* Sky blue action branding color */
            color: white;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        
        #calculateBtn:hover {
            background-color: #0369a1;
        }
        
        #calculateBtn:active {
            transform: scale(0.98);
        }
        
        .back-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
        }
        
        .back-btn:hover {
            background-color: #f8fafc;
            color: #1e293b;
        }
        
        /* Styled Statement Breakdown Board */
        #result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.8;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            display: none; /* Keep hidden cleanly until execution */
        }
        
        .result-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .result-row:last-of-type {
            margin-bottom: 0;
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e1;
        }

        .highlight-green {
            color: #166534;
            font-weight: 700;
            font-size: 16px;
        }
        
        .value-bold {
            font-weight: 600;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Installment Calculator</h2>
        
        <label for="amount">Enter Amount</label>
        <input type="number" id="amount" placeholder="e.g. 10000" min="1">
        
        <label for="years">Select Terms</label>  
    <select id="years">
            <option value="1">1 Year</option>
            <option value="2">2 Years</option>
            <option value="3">3 Years</option>
        </select>
        
        <div class="btn-group">
            <button id="calculateBtn">Compute Financing Breakdown</button>
            <!-- Return to Home Page Anchor -->
            <a href="index.html" class="back-btn">Return to Shop</a>
        </div>
        
        <div id="result"></div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function(){
            const calculateBtn = document.getElementById('calculateBtn');
            const resultDiv = document.getElementById('result');

            calculateBtn.addEventListener('click', function(){
                const amount = parseFloat(document.getElementById('amount').value);
                const years = parseInt(document.getElementById('years').value);
                const interestRate = 0.05; // 5% per year interest matrix
                
                if (isNaN(amount) || amount <= 0) {
                    resultDiv.style.display = "block";
                    resultDiv.innerHTML = `<span style="color: #991b1b; font-weight: 600;">Validation Error: Please enter a valid financing amount.</span>`;
                    return;
                }
                
                const totalInterest = amount * interestRate * years;
                const totalPayment = amount + totalInterest;
                const yearlyPayment = totalPayment / years;
                const monthlyPayment = totalPayment / (years * 12);
                
                // Native localization configurations formatting numbers out cleanly
                const fInterest = totalInterest.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                const fTotal = totalPayment.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                const fYearly = yearlyPayment.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                const fMonthly = monthlyPayment.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

                resultDiv.style.display = "block";
                resultDiv.innerHTML = `
                    <div class="result-title">Financing Amortization Statement</div>
                    <div class="result-row"><span>Total Interest (5% p.a.):</span> <span class="value-bold">₱${fInterest}</span></div>
                    <div class="result-row"><span>Gross Payable Amount:</span> <span class="value-bold">₱${fTotal}</span></div>
                    <div class="result-row"><span>Yearly Amortization:</span> <span class="value-bold">₱${fYearly}</span></div>
                    <div class="result-row"><span>Monthly Installment:</span> <span class="highlight-green">₱${fMonthly}</span></div>
                `;
            });
        });
    </script>
</body>
</html>
